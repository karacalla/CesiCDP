<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Essai S5 — animation du camion du panneau</title>
    <style>
      html,body{margin:0;height:100%;background:#0f172a;font-family:system-ui;overflow:hidden}
      #panel{position:absolute;right:20px;top:20px;bottom:20px;width:480px;border-radius:36px;background:rgb(241 243 245/.8)}
      #truck{position:absolute;left:0;top:0;width:140px;height:60px;border-radius:12px;background:#e2e8f0;box-shadow:0 0 0 2px #f59e0b}
      #path{position:fixed;inset:0;pointer-events:none}
    </style>
  </head>
  <body>
    <div id="panel"></div>
    <div id="truck"></div>
    <svg id="path" width="100%" height="100%" aria-hidden="true"><path id="p" fill="none" stroke="rgba(245,158,11,.4)" stroke-dasharray="4 6" /></svg>
    <script type="module" src="./s5.ts"></script>
  </body>
</html>
